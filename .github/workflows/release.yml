name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aab:
        description: 'Compilar también el AAB para Play'
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.plan.outputs.bump }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      - name: Calcular la próxima versión
        id: plan
        run: dart tool/release.dart plan >> "$GITHUB_OUTPUT"

      - name: Avisar si no hay nada que publicar
        if: steps.plan.outputs.bump == 'none'
        run: echo "::notice::No hay cambios que publicar (ningún feat, fix, perf ni breaking desde el último tag)."

  # Analyze y tests van en su propio runner, a la vez que la compilación: la
  # release solo se publica si los dos salen bien.
  checks:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Comprobar que pubspec.lock está al día
        run: flutter pub get --enforce-lockfile

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  build:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # El runner no trae el NDK que pide Flutter y Gradle lo bajaba en cada
      # release. shortcut: la versión va a mano; si Flutter sube la suya, la
      # caché deja de acertar y Gradle lo baja como antes hasta actualizarla.
      - name: Caché del NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Preparar config de Firebase y de firma
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Comprobar que pubspec.lock está al día
        run: flutter pub get --enforce-lockfile

      - name: Escribir la versión en pubspec.yaml
        run: dart tool/release.dart apply "$VERSION" "$BUILD_NUMBER"

      # Solo arm64: cada arquitectura de más es otra compilación AOT entera y
      # otra copia de la app dentro del APK.
      - name: Compilar APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Compilar AAB
        if: inputs.aab
        run: flutter build appbundle --release

      # El número de commits va en el nombre para que dos releases del mismo
      # día no compartan archivo.
      - name: Preparar los archivos de la release
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/comfylist-$VERSION+$BUILD_NUMBER.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/comfylist-$VERSION+$BUILD_NUMBER.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
          # «Re-run all jobs» vuelve a subirlo con el mismo nombre.
          overwrite: true
          # El APK ya va comprimido.
          compression-level: 0

  release:
    needs: [plan, checks, build]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `verify_release.dart` usa paquetes de la app, así que hace falta el SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Comprobar que pubspec.lock está al día
        run: flutter pub get --enforce-lockfile

      - name: Escribir la versión en pubspec.yaml
        run: dart tool/release.dart apply "$VERSION" "$BUILD_NUMBER"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generar notas de la release
        run: dart tool/release.dart notes "$PREVIOUS_TAG" "$TAG" > release-notes.md

      - name: Commit de versión y tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          # Con `--atomic` los dos refs entran en la misma petición: si el tag va
          # aparte, GitHub puede rechazarlo con «missing necessary objects»
          # porque el commit recién creado aún no está disponible para la otra.
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "ComfyList $VERSION.$BUILD_NUMBER" \
            --notes-file release-notes.md \
            dist/*

      # Va después de subir porque el `digest` solo existe una vez publicado, y
      # es el que la app compara antes de instalar: si no cuadra, esa release no
      # se puede dar por buena aunque ya esté fuera.
      - name: Comprobar que lo subido es lo compilado
        env:
          GH_TOKEN: ${{ github.token }}
        run: dart tool/verify_release.dart "$TAG" dist/*
