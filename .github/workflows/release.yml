name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.plan.outputs.bump }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      - name: Calcular la próxima versión
        id: plan
        run: dart tool/release.dart plan >> "$GITHUB_OUTPUT"

      - name: Avisar si no hay nada que publicar
        if: steps.plan.outputs.bump == 'none'
        run: echo "::notice::No hay cambios que publicar (ningún feat, fix, perf ni breaking desde el último tag)."

  release:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BUILD_NUMBER: ${{ needs.plan.outputs.build }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Preparar config de Firebase y de firma
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Comprobar que pubspec.lock está al día
        run: flutter pub get --enforce-lockfile

      - name: Escribir la versión en pubspec.yaml
        run: dart tool/release.dart apply "$VERSION" "$BUILD_NUMBER"

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Compilar APK y AAB
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Generar notas de la release
        run: dart tool/release.dart notes "$PREVIOUS_TAG" "$TAG" > release-notes.md

      - name: Commit de versión y tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          # El número de commits va en el nombre para que dos releases del mismo
          # día no compartan archivo.
          cp build/app/outputs/flutter-apk/app-release.apk "dist/comfylist-$VERSION+$BUILD_NUMBER.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/comfylist-$VERSION+$BUILD_NUMBER.aab"
          gh release create "$TAG" \
            --title "ComfyList $VERSION ($BUILD_NUMBER)" \
            --notes-file release-notes.md \
            "dist/comfylist-$VERSION+$BUILD_NUMBER.apk" \
            "dist/comfylist-$VERSION+$BUILD_NUMBER.aab"
