name: comfy_list
description: "App de TODOs y citas multiplataforma con sincronización vía Firebase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.3.1

  # HTTP / REST
  dio: ^5.9.2
  http: ^1.6.0

  # Routing
  go_router: ^17.2.3

  # Local DB
  drift: ^2.20.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure storage (tokens)
  flutter_secure_storage: ^10.1.0

  # Firebase
  firebase_core: ^3.13.0

  # Google Sign-In (solo Android en fase 1)
  google_sign_in: ^7.2.0

  # Notificaciones locales
  flutter_local_notifications: ^21.0.0
  # Zonas horarias: `zonedSchedule` recibe la hora como TZDateTime
  timezone: ^0.11.0

  # Animaciones / assets
  flutter_animate: ^4.5.2
  lottie: ^3.3.3
  flutter_svg: ^2.3.0

  # Desktop window helpers
  window_manager: ^0.5.1
  win32: ^6.2.0

  # Fechas localizadas
  intl: ^0.20.2

  # Localización de widgets Material/Cupertino
  flutter_localizations:
    sdk: flutter
  marquee: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Tests
  mocktail: ^1.0.4

  # Codegen (Drift)
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

  # App icon generation
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/svg/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: "assets/fonts/PlusJakartaSans-VariableFont.ttf"
    - family: Fredoka
      fonts:
        - asset: "assets/fonts/Fredoka-VariableFont.ttf"

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo-no-background.png"
  adaptive_icon_background: "assets/mobile/background.png"
  adaptive_icon_foreground: "assets/mobile/foreground.png"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
