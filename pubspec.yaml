name: comfy_list
description: "App de TODOs y citas multiplataforma con sincronización vía Firebase"
publish_to: 'none'
version: 2026.10.31+356

environment:
  sdk: ^3.11.5
  # Versión exacta del SDK: Dependabot la usa para resolver el lockfile y el CI
  # la lee (flutter-version-file), así que solo hay un pin.
  flutter: 3.44.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  flutter_riverpod: ^3.4.3

  # HTTP / REST
  dio: ^5.11.1
  http: ^1.6.0

  # Routing
  go_router: ^18.0.2

  # Local DB
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure storage (tokens)
  flutter_secure_storage: ^11.2.0

  # Firebase
  firebase_core: ^4.15.0

  # Google Sign-In (solo Android en fase 1)
  google_sign_in: ^7.2.0

  # Notificaciones locales
  flutter_local_notifications: ^21.0.0
  # Zonas horarias: `zonedSchedule` recibe la hora como TZDateTime
  timezone: ^0.11.1

  # Animaciones / assets
  flutter_animate: ^4.5.2
  lottie: ^3.6.1
  flutter_svg: ^2.3.0

  # Desktop window helpers
  window_manager: ^0.5.2
  win32: ^6.4.0

  # Versión instalada (pie de Ajustes)
  package_info_plus: ^10.2.2

  # SHA-256 del APK descargado antes de instalarlo
  crypto: ^3.0.7

  # Fechas localizadas
  intl: ^0.20.2

  # Localización de widgets Material/Cupertino
  flutter_localizations:
    sdk: flutter
  marquee: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Tests
  mocktail: ^1.0.4

  # Codegen (Drift)
  build_runner: ^2.15.1
  drift_dev: ^2.20.3

  # App icon generation
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/svg/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: "assets/fonts/PlusJakartaSans-VariableFont.ttf"
    - family: Fredoka
      fonts:
        - asset: "assets/fonts/Fredoka-VariableFont.ttf"

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo-no-background.png"
  adaptive_icon_background: "assets/mobile/background.png"
  adaptive_icon_foreground: "assets/mobile/foreground.png"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
